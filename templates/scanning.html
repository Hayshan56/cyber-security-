<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scanning in Progress</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .spinner { margin: 20px auto; border: 8px solid #f3f3f3; border-top: 8px solid #3498db; border-radius: 50%; width: 60px; height: 60px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h2>Scanning target: {{ target }}...</h2>
    <p>This may take a few minutes. Please wait.</p>
    <div class="spinner"></div>
    <p id="status">Status: Pending...</p>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const taskId = "{{ task_id }}";
            const statusUrl = `/status/${taskId}`;

            function checkStatus() {
                fetch(statusUrl)
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('status').innerText = `Status: ${data.status}`;
                        if (data.state === 'SUCCESS') {
                            window.location.href = data.result_url;
                        } else if (data.state === 'FAILURE') {
                            // Stop polling if the task failed
                        } else {
                            // Continue polling every 3 seconds
                            setTimeout(checkStatus, 3000);
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching task status:', error);
                        document.getElementById('status').innerText = 'Error fetching status.';
                    });
            }

            // Start polling for status
            checkStatus();
        });
    </script>
</body>
</html>
